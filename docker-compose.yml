version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lgu-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lgu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lgu_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-lgu_super_app}
      TZ: Asia/Karachi
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lgu_admin} -d ${POSTGRES_DB:-lgu_super_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lgu-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
